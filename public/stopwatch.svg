<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Top button -->
  <rect x="88" y="2" width="24" height="16" rx="4" fill="#555" stroke="#333" stroke-width="1.5"/>
  <!-- Side button right -->
  <rect x="182" y="80" width="14" height="20" rx="3" fill="#555" stroke="#333" stroke-width="1.5"/>
  <!-- Side button left -->
  <rect x="4" y="80" width="14" height="20" rx="3" fill="#555" stroke="#333" stroke-width="1.5"/>
  <!-- Outer case -->
  <rect x="16" y="24" width="168" height="220" rx="28" fill="#2a2a2a" stroke="#444" stroke-width="3"/>
  <!-- Inner bezel -->
  <rect x="26" y="34" width="148" height="200" rx="20" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <!-- Screen background -->
  <rect x="36" y="50" width="128" height="168" rx="8" fill="#0a2a0a"/>
  <!-- Screen inner glow -->
  <rect x="40" y="54" width="120" height="160" rx="6" fill="#0d350d"/>

  <!-- Digital time display -->
  <text x="100" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#39ff14" letter-spacing="2">00:00</text>
  <!-- Milliseconds -->
  <text x="100" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="24" fill="#2abf0f" letter-spacing="1">.00</text>

  <!-- Top label -->
  <text x="100" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#1a8a1a" letter-spacing="3">SAGE TIMER</text>

  <!-- Lap / Split indicators -->
  <text x="56" y="178" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#1a8a1a">LAP</text>
  <text x="100" y="178" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#39ff14">SPLIT</text>
  <text x="144" y="178" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#1a8a1a">TOTAL</text>

  <!-- Lap time display -->
  <text x="100" y="200" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#2abf0f">00:00.00</text>

  <!-- Brand text at bottom -->
  <text x="100" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666" letter-spacing="2">SPORTS CHRONOGRAPH</text>
</svg>
