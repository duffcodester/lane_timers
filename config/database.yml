default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: lane_timers_development

test:
  <<: *default
  database: lane_timers_test

production:
  <<: *default
  database: lane_timers_production
  url: <%= ENV["DATABASE_URL"] %>
